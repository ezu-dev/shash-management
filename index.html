<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHASH Management System</title>
    <style>
        :root {
            --primary: #ffffff;
            --accent: #f1c40f;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-attachment: fixed;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            text-align: center;
        }

        /* Header Section */
        header {
            margin-bottom: 40px;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 3px solid var(--accent);
        }

        .logo-box img { width: 80%; height: 80%; object-fit: contain; }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 10px 0 5px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .logo-box {
    width: 100px;
    height: 100px;
    background: #ffffff; /* Duubee adii qulqulluu */
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    border: 3px solid #f1c40f; /* Halluu Gold */
    overflow: hidden; /* Akka logoon boksa keessaa hin baane */
}

.logo-box img {
    width: 90%; 
    height: 90%; 
    object-fit: contain;
}

        .tagline {
            font-size: 13px;
            color: var(--accent);
            opacity: 0.9;
            font-weight: 500;
        }

        /* Menu Design */
        .menu-section {
            text-align: left;
            margin-top: 30px;
        }

        .section-label {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
            padding-left: 5px;
            letter-spacing: 1px;
            border-left: 3px solid var(--accent);
        }

        .nav-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .nav-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
        }

        .icon-wrapper {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
        }

        .card-info { flex-grow: 1; }

        .card-title {
            display: block;
            font-weight: 600;
            font-size: 16px;
        }

        .card-arrow {
            font-size: 18px;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 11px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-box">
            <img src="Shash.png" alt="Logo">
        </div>
        <h1>SHASH Trading</h1>
        <p class="tagline">Hordoffii Daldala Maatii - Harar</p>
    </header>

    <div class="menu-section">
        <p class="section-label">Gurgurtaa Adda Addaa</p>
        
        <a href="Dukkaana_Gurgurtaa.html" class="nav-card">
            <div class="icon-wrapper">📦</div>
            <div class="card-info">
                <span class="card-title">Dukkaana Jilmaa</span>
            </div>
            <span class="card-arrow">➜</span>
        </a>

        <a href="Gurgurtaa.html" class="nav-card">
            <div class="icon-wrapper">🍖</div>
            <div class="card-info">
                <span class="card-title">Mana Foonii Wara Shaash</span>
            </div>
            <span class="card-arrow">➜</span>
        </a>

        <p class="section-label" style="margin-top: 30px;">Hordoffii & Baasii</p>

        <a href="Dukkaana_Liqii.html" class="nav-card">
            <div class="icon-wrapper">💳</div>
            <div class="card-info">
                <span class="card-title">Galmee Liqii (Credit)</span>
            </div>
            <span class="card-arrow">➜</span>
        </a>

        <a href="Dukkaana_Stock.html" class="nav-card">
            <div class="icon-wrapper">📊</div>
            <div class="card-info">
                <span class="card-title">Hordoffii Stock</span>
            </div>
            <span class="card-arrow">➜</span>
        </a>

        <a href="Dukkaana_Baasii.html" class="nav-card">
            <div class="icon-wrapper">💸</div>
            <div class="card-info">
                <span class="card-title">Galmee Baasii</span>
            </div>
            <span class="card-arrow">➜</span>
        </a>
    </div>

    <footer>
        SHASH General Trading PLC Management System<br>
        Developed by Ezu Tech © 2026
    </footer>
</div>

</body>
</html>
