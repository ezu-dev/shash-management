<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHASH Management System</title>
    <style>
        :root {
            --primary-red: #4b0d0d;
            --gold: #f1c40f;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #4b0d0d, #1a0505, #000000);
            background-attachment: fixed;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Section */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        .logo-container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .logo-container:active { transform: scale(0.95); }

        .logo-img {
            width: 180px;
            height: auto;
            border-radius: 12px;
        }

        h1 {
            color: var(--gold);
            font-size: 26px;
            text-transform: uppercase;
            margin-top: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 90%;
            max-width: 400px;
            padding-bottom: 50px;
        }

        .nav-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .nav-card:active {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(2px);
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            background: rgba(241, 196, 15, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
            border: 1px solid var(--gold);
        }

        .title-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 17px;
        }

        .arrow { color: var(--gold); font-size: 20px; }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 12px;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Shash.png" class="logo-img" alt="SHASH LOGO">
    </div>
    <h1>Warra Shaash</h1>
    <p style="opacity: 0.7; font-style: italic;">Hordoffii Daldala Maatii</p>
</header>

<div class="menu-grid">
    <a href="Dukkaana_Gurgurtaa.html" class="nav-card">
        <div class="icon-circle">📦</div>
        <div class="title-text">Dukkaana Jilmaa</div>
        <div class="arrow">➜</div>
    </a>

    <a href="Gurgurtaa.html" class="nav-card">
        <div class="icon-circle">🍖</div>
        <div class="title-text">Mana Foonii</div>
        <div class="arrow">➜</div>
    </a>

    <a href="Dukkaana_Liqii.html" class="nav-card">
        <div class="icon-circle">💳</div>
        <div class="title-text">Galmee Liqii</div>
        <div class="arrow">➜</div>
    </a>

    <a href="Dukkaana_Stock.html" class="nav-card">
        <div class="icon-circle">📊</div>
        <div class="title-text">Stock & Inventory</div>
        <div class="arrow">➜</div>
    </a>

    <a href="Dukkaana_Baasii.html" class="nav-card">
        <div class="icon-circle">💸</div>
        <div class="title-text">Galmee Baasii</div>
        <div class="arrow">➜</div>
    </a>
</div>

<footer>
    © 2026 SHASH PLC | Developed by Ezu Tech
</footer>

<script>
    // Password Logic
    window.onload = function() {
        if (sessionStorage.getItem("authenticated") !== "true") {
            let pass = prompt("Maaloo Password Maatii Galchi:");
            if (pass === SHaash_2026") {
                sessionStorage.setItem("authenticated", "true");
            } else {
                alert("Dogoggora! Deebisii yaali.");
                window.location.reload();
            }
        }
    }
</script>

</body>
</html>
