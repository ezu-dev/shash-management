<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHASH General Trading - Main Menu</title>
    <style>
        :root { 
            --primary: #1a2a6c; 
            --gold: #f39c12; 
            --glass: rgba(255, 255, 255, 0.12);
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            background-attachment: fixed;
            color: white; 
            min-height: 100vh;
        }
        
        .hero { 
            padding: 40px 20px; 
            text-align: center;
        }

        .logo-img { 
            width: 110px; 
            height: 110px; 
            border: 3px solid var(--gold); 
            border-radius: 50%; 
            background: white; 
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 { 
            margin: 15px 0 5px; 
            font-size: 22px; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .sub-text {
            font-size: 13px;
            opacity: 0.9;
            color: #ecf0f1;
            margin-bottom: 30px;
        }

        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            padding: 0 20px 40px; 
            max-width: 500px; 
            margin: auto; 
        }

        .section-title { 
            text-align: left; 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--gold); 
            margin-top: 20px; 
            text-transform: uppercase;
            border-left: 3px solid var(--gold);
            padding-left: 10px;
        }

        .nav-card { 
            background: var(--glass); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px; 
            border-radius: 15px; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-card:active { transform: scale(0.97); }

        .nav-card span { 
            color: white; 
            font-weight: 600; 
            font-size: 16px; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .icon-circle { 
            width: 45px; 
            height: 45px; 
            background: rgba(255,255,255,0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 12px; 
            font-size: 20px; 
        }

        .card-jilmaa { border-left: 5px solid #3498db; }
        .card-foonii { border-left: 5px solid #e74c3c; }
        .card-liqii { border-left: 5px solid #f1c40f; }
        .card-stock { border-left: 5px solid #2ecc71; }

        .footer {
            padding: 20px;
            font-size: 11px;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="hero">
    <img src="logo_shash.png" class="logo-img" alt="Logo">
    <h1>SHASH General Trading</h1>
    <p class="sub-text">Hordoffii Daldala Maatii - Harar</p>
</div>

<div class="main-grid">
    <div class="section-title">Hojii Gurgurtaa</div>
    
    <a href="Dukkaana_Gurgurtaa.html" class="nav-card card-jilmaa">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="icon-circle">📦</div>
            <span>Dukkaana Jilmaa</span>
        </div>
        <span style="opacity: 0.5;">➔</span>
    </a>

    <a href="Gurgurtaa.html" class="nav-card card-foonii">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="icon-circle">🍖</div>
            <span>Mana Foonii Wara Shaash</span>
        </div>
        <span style="opacity: 0.5;">➔</span>
    </a>

    <div class="section-title">Hordoffii & Baasii</div>

    <a href="Dukkaana_Liqii.html" class="nav-card card-liqii">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="icon-circle">💳</div>
            <span>Galmee Liqii</span>
        </div>
        <span style="opacity: 0.5;">➔</span>
    </a>

    <a href="Dukkaana_Stock.html" class="nav-card card-stock">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="icon-circle">📊</div>
            <span>Hordoffii Stock</span>
        </div>
        <span style="opacity: 0.5;">➔</span>
    </a>

    <a href="Dukkaana_Baasii.html" class="nav-card">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="icon-circle">💸</div>
            <span>Baasii Waliigalaa</span>
        </div>
        <span style="opacity: 0.5;">➔</span>
    </a>
</div>

<div class="footer">
    © 2026 SHASH PLC | Developed by Ezu Tech
</div>

</body>
</html>
