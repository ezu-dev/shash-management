<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - SHASH General Trading</title>
    <style>
        :root { --primary: #34495e; --accent: #16a085; --warning: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .company-name { font-size: 24px; font-weight: bold; color: var(--primary); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 10px; color: white; text-align: center; }
        .card-in { background: var(--accent); }
        .card-alert { background: var(--warning); }

        .input-section { background: #e8f8f5; padding: 20px; border-radius: 12px; border: 1px solid #a3e4d7; margin-bottom: 20px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 8px; flex: 1; min-width: 140px; }
        
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-add { background: var(--accent); color: white; }
        .btn-home { background: #eee; color: #333; margin-top: 10px; text-decoration: none; display: block; text-align: center; line-height: 2.5; }

        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #eee; padding: 12px; font-size: 14px; }
        
        .stock-low { color: #e74c3c; font-weight: bold; background: #ffebee; }

        .signature-section { margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; text-align: center; }
        .sig-box { border-top: 1px solid #333; padding-top: 8px; font-weight: bold; }

        @media print {
            .input-section, .btn-home, .delete-btn { display: none !important; }
            .container { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="company-name">SHASH GENERAL TRADING PLC</div>
        <p style="margin:5px 0; color: #16a085; font-weight: bold;">Hordoffii Meeshaa Mana Kuusaa (Stock Control)</p>
    </header>

    <div class="dashboard">
        <div class="card card-in">
            <h3 style="margin:0; font-size: 13px;">Gosa Meeshaa</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="card card-alert">
            <h3 style="margin:0; font-size: 13px;">Meeshaa Xumuramuuf Jiru</h3>
            <p id="lowStockCount">0</p>
        </div>
    </div>

    <div class="input-section">
        <div class="input-group">
            <input type="text" id="stkName" placeholder="Maqaa Meeshaa (fkn. Ruuzii)...">
            <select id="stkUnit">
                <option value="Kaartona">Kaartona</option>
                <option value="Kiisha">Kiisha</option>
                <option value="Saanduqa">Saanduqa</option>
            </select>
            <input type="number" id="stkQty" placeholder="Baay'ina Galmeessi (Qty)...">
        </div>
        <button class="btn btn-add" onclick="addStock()">Meeshaa Galmeessi</button>
        <button class="btn btn-print" onclick="window.print()">Gabaasa Print Godhi (PDF)</button>
        <a href="index.html" class="btn btn-home">Gara Menu Guddaatti Deebi'i</a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Lakk.</th>
                    <th>Maqaa Meeshaa</th>
                    <th>Unit</th>
                    <th>Hamma Jiru</th>
                    <th>Status</th>
                    <th class="delete-btn">X</th>
                </tr>
            </thead>
            <tbody id="stockTable"></tbody>
        </table>
    </div>

    <div class="signature-section">
        <div class="sig-box">Mallattoo Kaasharii<br><small>(Mussii Muktaar)</small></div>
        <div class="sig-box">Mallattoo Manager<br><small>(Munisaa Mohammed Ahmed)</small></div>
    </div>
</div>

<script>
    let stock = JSON.parse(localStorage.getItem("shashJilmaaStock")) || [];

    function updateUI() {
        const tbody = document.getElementById("stockTable");
        tbody.innerHTML = "";
        let lowCount = 0;

        stock.forEach((item, i) => {
            let isLow = item.qty < 5; // Yoo 5 gadi ta'e alert kenna
            if(isLow) lowCount++;

            tbody.innerHTML += `<tr class="${isLow ? 'stock-low' : ''}">
                <td>${i+1}</td>
                <td>${item.name}</td>
                <td>${item.unit}</td>
                <td><b>${item.qty}</b></td>
                <td>${isLow ? '⚠️ Xumuramaa jira' : '✅ Gahaa dha'}</td>
                <td class="delete-btn">
                    <button onclick="adjustStock(${i}, 1)" style="color:green; border:none; background:none; font-weight:bold; cursor:pointer;">+</button>
                    <button onclick="adjustStock(${i}, -1)" style="color:red; border:none; background:none; font-weight:bold; cursor:pointer; margin-left:10px;">-</button>
                    <button onclick="deleteStock(${i})" style="color:#888; border:none; background:none; margin-left:10px; cursor:pointer;">✕</button>
                </td>
            </tr>`;
        });

        document.getElementById("totalItems").innerText = stock.length;
        document.getElementById("lowStockCount").innerText = lowCount;
        localStorage.setItem("shashJilmaaStock", JSON.stringify(stock));
    }

    function addStock() {
        const name = document.getElementById("stkName").value;
        const unit = document.getElementById("stkUnit").value;
        const qty = parseInt(document.getElementById("stkQty").value);

        if(name && qty) {
            let existing = stock.find(s => s.name.toLowerCase() === name.toLowerCase());
            if(existing) {
                existing.qty += qty;
            } else {
                stock.push({ name, unit, qty });
            }
            document.getElementById("stkName").value = "";
            document.getElementById("stkQty").value = "";
            updateUI();
        }
    }

    function adjustStock(i, amount) {
        stock[i].qty += amount;
        if(stock[i].qty < 0) stock[i].qty = 0;
        updateUI();
    }

    function deleteStock(i) {
        if(confirm("Meeshaa kana galmee irraa haquu barbaaddu?")) {
            stock.splice(i, 1);
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
